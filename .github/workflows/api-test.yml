name: ReqRes API Test

on:
  push:
    branches: [main]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cài đặt Newman và htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Chạy test với dữ liệu users.csv
        run: |
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            -d users.csv \
            --env-var "apiKey=${{ secrets.REQRES_API_KEY }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload báo cáo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
